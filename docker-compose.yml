version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: genomepipe_postgres
    environment:
      POSTGRES_DB: genomepipe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: genomepipe_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: genomepipe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./project/backend
      dockerfile: Dockerfile
    container_name: genomepipe_backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:genomepipe_password_dev@postgres:5432/genomepipe
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: your-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./project/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery_worker:
    build:
      context: ./project/backend
      dockerfile: Dockerfile
    container_name: genomepipe_celery_worker
    environment:
      DEBUG: "true"
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:genomepipe_password_dev@postgres:5432/genomepipe
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    volumes:
      - ./project/backend:/app
    command: celery -A app.celery_app worker --loglevel=info

  # Celery Flower (Monitoring)
  flower:
    build:
      context: ./project/backend
      dockerfile: Dockerfile
    container_name: genomepipe_flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
      - celery_worker
    command: celery -A app.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: genomepipe_network
